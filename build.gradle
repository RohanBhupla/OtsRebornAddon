buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = "1.0.0"
group = "net.rebornaddon"
archivesBaseName = "RebornAddon"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileJava.options.encoding = "UTF-8"
compileJava.options.compilerArgs += ['-proc:none']

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                rebornaddon {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                rebornaddon {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main { output.resourcesDir = output.classesDir }
}

def otsModsDir = file(System.getenv('OTS_MODS_DIR') ?: 'D:/Mods/Curseforge/minecraft/Instances/Otsutsuki Reborn/mods')

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2855'
    compileOnly fileTree(dir: otsModsDir, include: ['*.jar'],
            exclude: ['RebornAddon-*.jar', '00-RebornAddon-*.jar'])
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'net.rebornaddon.asm.RebornAddonLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': "1.12.2"
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

task verifyRebornLocalization {
    inputs.files fileTree('src/main/java') { include '**/*.java' }
    inputs.file file('src/main/resources/assets/rebornaddon/lang/en_us.lang')

    doLast {
        def languageFile = file('src/main/resources/assets/rebornaddon/lang/en_us.lang')
        def keys = [] as Set
        def duplicates = [] as Set
        languageFile.eachLine('UTF-8') { line ->
            if (!line || line.startsWith('#') || !line.contains('=')) {
                return
            }
            def key = line.substring(0, line.indexOf('=')).trim()
            if (!keys.add(key)) {
                duplicates.add(key)
            }
        }

        def missing = [] as Set
        def pattern = ~/(?:ClientLocalization|I18n)\.format\(\s*"((?:gui|message|key|item)\.rebornaddon\.[^"]+)"/
        fileTree('src/main/java').matching { include '**/*.java' }.each { source ->
            def matcher = source.getText('UTF-8') =~ pattern
            matcher.each { match ->
                if (!keys.contains(match[1])) {
                    missing.add(match[1])
                }
            }
        }

        if (!duplicates.isEmpty()) {
            throw new GradleException("Duplicate RebornAddon localization keys: ${duplicates.sort().join(', ')}")
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing RebornAddon localization keys: ${missing.sort().join(', ')}")
        }
    }
}

check.dependsOn verifyRebornLocalization
