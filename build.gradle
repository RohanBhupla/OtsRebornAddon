buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

version = "1.0"
group = "net.rebornaddon"
archivesBaseName = "RebornAddon"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'
compileJava.options.encoding = "UTF-8"
compileJava.options.compilerArgs += ['-proc:none']

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                rebornaddon {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                rebornaddon {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main { output.resourcesDir = output.classesDir }
}

def otsModsDir = file(System.getenv('OTS_MODS_DIR') ?: 'run/mods')

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
    compileOnly fg.deobf('mezz.jei:jei_1.12.2:4.16.1.302:api')
    compileOnly fileTree(dir: otsModsDir, include: ['*.jar'],
            exclude: ['RebornAddon-*.jar', '00-RebornAddon-*.jar'])
    testImplementation 'junit:junit:4.13.2'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'FMLCorePlugin': 'net.rebornaddon.asm.RebornAddonLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true'
        )
    }
}

// A plain `jar` invocation must still produce the runtime-obfuscated Forge artifact.
jar.finalizedBy 'reobfJar'

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.12.2"

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': "1.12.2"
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

task verifyRebornLocalization {
    inputs.files fileTree('src/main/java') { include '**/*.java' }
    inputs.file file('src/main/resources/assets/rebornaddon/lang/en_us.lang')

    doLast {
        def languageFile = file('src/main/resources/assets/rebornaddon/lang/en_us.lang')
        def keys = [] as Set
        def duplicates = [] as Set
        languageFile.eachLine('UTF-8') { line ->
            if (!line || line.startsWith('#') || !line.contains('=')) {
                return
            }
            def key = line.substring(0, line.indexOf('=')).trim()
            if (!keys.add(key)) {
                duplicates.add(key)
            }
        }

        def missing = [] as Set
        def pattern = ~/(?:ClientLocalization|I18n)\.format\(\s*"((?:gui|message|key|item)\.rebornaddon\.[^"]+)"/
        fileTree('src/main/java').matching { include '**/*.java' }.each { source ->
            def matcher = source.getText('UTF-8') =~ pattern
            matcher.each { match ->
                if (!keys.contains(match[1])) {
                    missing.add(match[1])
                }
            }
        }

        if (!duplicates.isEmpty()) {
            throw new GradleException("Duplicate RebornAddon localization keys: ${duplicates.sort().join(', ')}")
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing RebornAddon localization keys: ${missing.sort().join(', ')}")
        }
    }
}

task verifyNativeContentIsolation {
    inputs.files fileTree('src/main/java') { include '**/*.java' }
    inputs.files file('src/main/resources/mcmod.info')

    doLast {
        def violations = []
        fileTree('src/main/java').matching { include '**/*.java' }.each { source ->
            def text = source.getText('UTF-8')
            if (text.contains('import noppes.npcs') || text.contains('D:\\Mods\\')
                    || text.contains('C:\\Users\\')) {
                violations.add(source.path)
            }
        }
        def metadata = file('src/main/resources/mcmod.info').getText('UTF-8').toLowerCase()
        if (metadata.contains('required-after:customnpcs') || metadata.contains('after:customnpcs')) {
            violations.add('src/main/resources/mcmod.info')
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Native content isolation violations: ${violations.sort().join(', ')}")
        }
    }
}

check.dependsOn verifyRebornLocalization, verifyNativeContentIsolation
